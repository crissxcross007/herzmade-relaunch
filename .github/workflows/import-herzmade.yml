name: Import Herzmade working copy
on:
  push:
    paths:
      - '.github/workflows/import-herzmade.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out relaunch
        uses: actions/checkout@v4
      - name: Check out original read-only at reviewed revision
        uses: actions/checkout@v4
        with:
          repository: crissxcross007/herzmade
          ref: 9bfa157bd124154d0457ee2151ca8a371a205748
          path: _original
          persist-credentials: false
      - name: Import files without domain or automation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, re
          source = Path('_original')
          for item in source.iterdir():
              if item.name in {'.git', '.github', 'CNAME', 'README.md'}:
                  continue
              dest = Path(item.name)
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)
          for page in Path('.').rglob('*.html'):
              if '_original' in page.parts or '.git' in page.parts:
                  continue
              html = page.read_text(encoding='utf-8')
              html = re.sub(r'<meta\s+name=["\x27]robots["\x27][^>]*>', '', html, flags=re.I)
              html = re.sub(r'<head([^>]*)>', r'<head\1>\n<meta name="robots" content="noindex, nofollow">', html, count=1, flags=re.I)
              page.write_text(html, encoding='utf-8')
          Path('robots.txt').write_text('User-agent: *\nDisallow:\n', encoding='utf-8')
          Path('.nojekyll').touch()
          shutil.rmtree(source)
          PY
          git add .
          if ! git diff --cached --quiet; then
            git -c user.name="Herzmade Relaunch" -c user.email="120314475+crissxcross007@users.noreply.github.com" commit -m "Copy Herzmade into isolated noindex test project without custom domain"
            git push origin HEAD:main
          fi
